quarkus.application.name=orders-service
quarkus.http.port=${HTTP_PORT:8080}

# --- datasource: dev and prod read the environment, secrets without default; test and it use Dev Services ---
quarkus.datasource.db-kind=postgresql
%dev,prod.quarkus.datasource.jdbc.url=${DB_URL}
%dev,prod.quarkus.datasource.username=${DB_USERNAME}
%dev,prod.quarkus.datasource.password=${DB_PASSWORD}
quarkus.datasource.jdbc.max-size=${DB_POOL_MAX:16}
quarkus.hibernate-orm.database.generation=none
quarkus.flyway.migrate-at-start=true
quarkus.datasource.devservices.image-name=docker.io/library/postgres:16-alpine
quarkus.datasource.devservices.db-name=orders
%dev.quarkus.devservices.enabled=false

# --- every service owns one schema, so several services can share a database ---
quarkus.datasource.jdbc.additional-jdbc-properties.currentSchema=${DB_SCHEMA:orders}
quarkus.flyway.schemas=${DB_SCHEMA:orders}

# --- kafka ---
%dev,prod.kafka.bootstrap.servers=${KAFKA_BOOTSTRAP_SERVERS}
%dev,prod.kafka.security.protocol=${KAFKA_SECURITY_PROTOCOL:PLAINTEXT}
%dev,prod.kafka.sasl.mechanism=${KAFKA_SASL_MECHANISM:PLAIN}
%dev,prod.kafka.sasl.jaas.config=${KAFKA_SASL_JAAS_CONFIG:}

mp.messaging.outgoing.outbox.connector=smallrye-kafka
mp.messaging.outgoing.outbox.topic=${ORDERS_PLACED_TOPIC:orders.placed}
mp.messaging.outgoing.outbox.key.serializer=org.apache.kafka.common.serialization.StringSerializer
mp.messaging.outgoing.outbox.value.serializer=org.apache.kafka.common.serialization.StringSerializer

mp.messaging.incoming.inventory-reserved.connector=smallrye-kafka
mp.messaging.incoming.inventory-reserved.topic=${INVENTORY_RESERVED_TOPIC:inventory.reserved}
mp.messaging.incoming.inventory-reserved.group.id=${quarkus.application.name}
mp.messaging.incoming.inventory-reserved.key.deserializer=org.apache.kafka.common.serialization.StringDeserializer
mp.messaging.incoming.inventory-reserved.value.deserializer=org.apache.kafka.common.serialization.StringDeserializer
mp.messaging.incoming.inventory-reserved.auto.offset.reset=earliest
mp.messaging.incoming.inventory-reserved.failure-strategy=dead-letter-queue
mp.messaging.incoming.inventory-reserved.dead-letter-queue.topic=${INVENTORY_RESERVED_TOPIC:inventory.reserved}.dlq

mp.messaging.incoming.inventory-rejected.connector=smallrye-kafka
mp.messaging.incoming.inventory-rejected.topic=${INVENTORY_REJECTED_TOPIC:inventory.rejected}
mp.messaging.incoming.inventory-rejected.group.id=${quarkus.application.name}
mp.messaging.incoming.inventory-rejected.key.deserializer=org.apache.kafka.common.serialization.StringDeserializer
mp.messaging.incoming.inventory-rejected.value.deserializer=org.apache.kafka.common.serialization.StringDeserializer
mp.messaging.incoming.inventory-rejected.auto.offset.reset=earliest
mp.messaging.incoming.inventory-rejected.failure-strategy=dead-letter-queue
mp.messaging.incoming.inventory-rejected.dead-letter-queue.topic=${INVENTORY_REJECTED_TOPIC:inventory.rejected}.dlq

# --- application ---
orders.topics.order-placed=${ORDERS_PLACED_TOPIC:orders.placed}
orders.outbox.poll-interval=${OUTBOX_POLL_INTERVAL:1s}
orders.outbox.batch-size=${OUTBOX_BATCH_SIZE:100}

# --- observability ---
quarkus.log.console.json.enabled=${LOG_JSON:false}
quarkus.log.level=${LOG_LEVEL:INFO}
quarkus.micrometer.export.prometheus.enabled=true
quarkus.smallrye-openapi.info-title=Orders Service API
quarkus.smallrye-openapi.info-version=1.0.0

%test.quarkus.jacoco.data-file=target/jacoco-quarkus.exec
%test.quarkus.jacoco.report-location=target/site/jacoco

# --- @QuarkusIntegrationTest runs the packaged app against Dev Services (Postgres + Kafka) ---
quarkus.test.integration-test-profile=it
quarkus.http.test-port=0
